spring:
  datasource:
    url: jdbc:h2:mem:wifiadmin-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

wifi-admin:
  platform:
    soap:
      url: http://localhost:8080/platform
      connect-timeout-ms: 1000
      read-timeout-ms: 1000
  sync:
    enabled: false
    cron: "0 0 3 * * *"
    cpe-ids: []
  cors:
    allowed-origins:
      - http://localhost:5173

logging:
  level:
    root: WARN
    hr.ht.rnd.wifiadmin: INFO
