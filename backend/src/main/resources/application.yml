server:
  port: 8081

spring:
  application:
    name: wifi-admin-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{correlationId:-}] - %msg%n"

wifi-admin:
  platform:
    soap:
      url: http://localhost:8080/platform
      connect-timeout-ms: 5000
      read-timeout-ms: 5000
  sync:
    enabled: true
    cron: "0 0 3 * * *"
    cpe-ids:
      - CPE_001
      - CPE_002
      - CPE_003
      - CPE_004
      - CPE_005
      - CPE_006
      - CPE_007
      - CPE_008
      - CPE_009
      - CPE_010
      - CPE_011
      - CPE_012
  cors:
    allowed-origins:
      - http://localhost:5173
