server:
  port: 8081

spring:
  application:
    name: wifi-admin-backend

  datasource:
    url: jdbc:h2:mem:wifiadmin
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

platform:
  soap:
    url: http://localhost:8080/platform
    connect-timeout-ms: 5000
    read-timeout-ms: 5000

scheduler:
  wifi-sync:
    enabled: true
    cron: "0 0 2 * * *"
    batch-size: 100